services:
  proxysql:
    image: proxysql/proxysql:3.0
    environment:
      PSQL_ADMIN_PASSWORD: ${PSQL_ADMIN_PASSWORD}
      MONITOR_PASSWORD: ${PSQL_ADMIN_PASSWORD}
    volumes:
      - ./proxysql.cnf.tpl:/tpl/proxysql.cnf.tpl:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - proxysql-data:/var/lib/proxysql
    ports:
      - "${PANEL_PROXY_PORT}:6033"
    networks: [dbnet, 1panel-network]
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]

  admin-ui:
    build: ./ui
    environment:
      PSQL_ADMIN_HOST: proxysql
      PSQL_ADMIN_PORT: "6032"
      PSQL_ADMIN_USER: uiadmin
      PSQL_ADMIN_PASSWORD: ${PSQL_ADMIN_PASSWORD}
      UI_PASSWORD: ${UI_PASSWORD}
      MYSQL_MGMT_HOST: ""
      MYSQL_MGMT_PORT: "3306"
      MYSQL_MGMT_USER: ""
      MYSQL_MGMT_PASSWORD: ""
    volumes:
      - ./ui-data:/app/data
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    depends_on: [proxysql]
    networks: [dbnet, 1panel-network]
    restart: unless-stopped

networks:
  dbnet:
  1panel-network:
    external: true

volumes:
  proxysql-data:
