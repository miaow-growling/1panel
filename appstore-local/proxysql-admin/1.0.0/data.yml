additionalProperties:
  formFields:
    - default: 8080
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Admin Panel Port
      labelZh: 面板端口
      required: true
      rule: paramPort
      type: number
    - default: ""
      envKey: UI_PASSWORD
      labelEn: Panel Login Password
      labelZh: 面板登录密码
      random: true
      required: true
      type: password
    - default: ""
      envKey: PSQL_ADMIN_PASSWORD
      labelEn: ProxySQL Admin Password
      labelZh: ProxySQL 管理密码
      random: true
      required: true
      type: password
    - default: 6033
      envKey: PANEL_PROXY_PORT
      labelEn: Proxy Port (external)
      labelZh: 代理端口（对外）
      description:
        zh: 宿主机映射到 ProxySQL 6033 的端口，外部客户端（Navicat 等）经此连接；如仅容器间互访可随意填
      required: true
      rule: paramPort
      type: number
    - default: mysql
      envKey: MYSQL_BACKEND_HOST
      labelEn: Backend MySQL Host
      labelZh: 后端 MySQL 地址
      description:
        zh: 填 1Panel MySQL 应用的容器名（默认 mysql）或主机地址，两容器已同网络互通
      required: true
      type: text
    - default: 3306
      envKey: MYSQL_BACKEND_PORT
      labelEn: Backend MySQL Port
      labelZh: 后端 MySQL 端口
      required: true
      rule: paramPort
      type: number
